<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANPR Trajectory Tracking - SIH Prototype</title>
    
    <!-- Tailwind CSS (CDN for simple setup) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet CSS & JS for interactive maps -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        /* Map needs a definitive height */
        #map { height: 500px; width: 100%; z-index: 1; }
        
        /* Custom scrollbar for alert list */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans h-screen flex flex-col">
    
    <!-- Navigation / Header -->
    <header class="bg-slate-900 text-white p-4 shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7" />
                </svg>
                ANPR Trajectory System
            </h1>
            <div class="flex space-x-6 text-sm font-medium">
                <div class="bg-slate-800 px-3 py-1 rounded">Total Vehicles: <span id="stat-vehicles" class="text-blue-400">...</span></div>
                <div class="bg-slate-800 px-3 py-1 rounded">Active Cameras: <span id="stat-cameras" class="text-green-400">...</span></div>
                <div class="bg-slate-800 px-3 py-1 rounded">Pattern Alerts: <span id="stat-alerts" class="text-red-400">...</span></div>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <div class="container mx-auto flex-grow p-4 flex flex-col md:flex-row gap-6 h-full overflow-hidden">
        
        <!-- Left Panel: Search & Trajectory Info -->
        <div class="w-full md:w-1/3 flex flex-col gap-6 h-full">
            
            <!-- Search Widget -->
            <div class="bg-white p-5 rounded-lg shadow-md border border-gray-200">
                <h2 class="text-lg font-bold mb-3 text-slate-800">Search Vehicle</h2>
                <div class="flex gap-2">
                    <input type="text" id="plate-input" placeholder="e.g. DL01AB1234" 
                           class="border-2 border-gray-300 p-2 rounded-lg w-full uppercase focus:outline-none focus:border-blue-500 font-mono"
                           onkeypress="if(event.key === 'Enter') searchVehicle()">
                    <button onclick="searchVehicle()" 
                            class="bg-blue-600 text-white px-5 py-2 rounded-lg hover:bg-blue-700 transition font-semibold shadow">
                        Search
                    </button>
                </div>
                <div id="search-error" class="text-red-500 text-sm mt-3 hidden font-medium"></div>
            </div>

            <!-- Trajectory Event List -->
            <div class="bg-white p-5 rounded-lg shadow-md border border-gray-200 flex-grow flex flex-col overflow-hidden">
                <h2 class="text-lg font-bold mb-3 text-slate-800 border-b pb-2">Trajectory Info</h2>
                <div class="overflow-y-auto flex-grow pr-2">
                    <ul id="trajectory-list" class="space-y-4">
                        <li class="text-gray-500 italic text-center mt-10">
                            Search for a plate number to load its tracking history.
                        </li>
                    </ul>
                </div>
            </div>
        </div>

        <!-- Right Panel: Map & Alerts -->
        <div class="w-full md:w-2/3 flex flex-col gap-6 h-full">
            
            <!-- Map View -->
            <div class="bg-white p-2 rounded-lg shadow-md border border-gray-200">
                <div id="map" class="rounded border border-gray-300"></div>
            </div>

            <!-- Real-time Alerts Table -->
            <div class="bg-white p-5 rounded-lg shadow-md border border-gray-200 flex-grow overflow-hidden flex flex-col">
                <h2 class="text-lg font-bold mb-3 text-red-600 flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
                    </svg>
                    Recent System Alerts
                </h2>
                <div class="overflow-y-auto flex-grow">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-slate-100 sticky top-0">
                            <tr>
                                <th class="p-3 font-semibold text-slate-700">Timestamp</th>
                                <th class="p-3 font-semibold text-slate-700">Plate Number</th>
                                <th class="p-3 font-semibold text-slate-700">Alert Type</th>
                                <th class="p-3 font-semibold text-slate-700">Description</th>
                            </tr>
                        </thead>
                        <tbody id="alerts-table" class="divide-y divide-gray-100">
                            <!-- Populated dynamically -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Application Logic -->
    <script>
        // 1. Initialize Map
        const map = L.map('map').setView([28.6139, 77.2090], 11); // Centered on Delhi
        
        // Add OpenStreetMap tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // Layers for clearing data on new searches
        let trajectoryLayer = L.layerGroup().addTo(map);
        let cameraLayer = L.layerGroup().addTo(map);

        // 2. Fetch System Statistics
        async function fetchStats() {
            try {
                const res = await fetch('/api/stats');
                const stats = await res.json();
                document.getElementById('stat-vehicles').innerText = stats.total_vehicles.toLocaleString();
                document.getElementById('stat-cameras').innerText = stats.total_cameras.toLocaleString();
                document.getElementById('stat-alerts').innerText = stats.total_alerts.toLocaleString();
            } catch (err) {
                console.error("Failed to load stats", err);
            }
        }

        // 3. Fetch Alerts
        async function fetchAlerts() {
            try {
                const res = await fetch('/api/alerts');
                const alerts = await res.json();
                const tbody = document.getElementById('alerts-table');
                tbody.innerHTML = '';
                
                alerts.forEach(a => {
                    // Badge color logic
                    let badgeColor = 'bg-yellow-100 text-yellow-800 border-yellow-200';
                    if (a.type.includes('Stalking')) badgeColor = 'bg-red-100 text-red-800 border-red-200';
                    if (a.type.includes('High-Speed')) badgeColor = 'bg-orange-100 text-orange-800 border-orange-200';

                    tbody.innerHTML += `
                        <tr class="hover:bg-slate-50 transition">
                            <td class="p-3 text-gray-500 whitespace-nowrap">${a.timestamp}</td>
                            <td class="p-3 font-mono font-bold text-slate-800 cursor-pointer hover:text-blue-600" onclick="document.getElementById('plate-input').value='${a.plate_number}'; searchVehicle();">${a.plate_number}</td>
                            <td class="p-3">
                                <span class="px-2 py-1 text-xs rounded border font-semibold ${badgeColor}">${a.type}</span>
                            </td>
                            <td class="p-3 text-gray-600">${a.description}</td>
                        </tr>
                    `;
                });
            } catch (err) {
                console.error("Failed to load alerts", err);
            }
        }

        // 4. Fetch and Plot All Cameras
        async function fetchCameras() {
            try {
                const res = await fetch('/api/cameras');
                const cameras = await res.json();
                
                cameraLayer.clearLayers();
                cameras.forEach(c => {
                    // Draw cameras as small grey dots
                    L.circleMarker([c.latitude, c.longitude], {
                        radius: 4,
                        color: '#64748b',
                        weight: 1,
                        fillColor: '#94a3b8',
                        fillOpacity: 0.5
                    }).bindPopup(`<b class="text-sm">${c.name}</b>`).addTo(cameraLayer);
                });
            } catch (err) {
                console.error("Failed to load cameras", err);
            }
        }

        // 5. Search & Plot Vehicle Trajectory
        async function searchVehicle() {
            const plate = document.getElementById('plate-input').value.toUpperCase().trim();
            const errorDiv = document.getElementById('search-error');
            const listDiv = document.getElementById('trajectory-list');
            
            if (!plate) {
                errorDiv.innerText = "Please enter a plate number.";
                errorDiv.classList.remove('hidden');
                return;
            }

            try {
                // UI Reset
                errorDiv.classList.add('hidden');
                trajectoryLayer.clearLayers();
                listDiv.innerHTML = `
                    <div class="flex justify-center p-5">
                        <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
                    </div>`;

                // Fetch Data
                const res = await fetch(`/api/vehicle/${plate}`);
                
                if (!res.ok) {
                    throw new Error("Vehicle not found in database.");
                }

                const data = await res.json();
                const trajectory = data.trajectory;

                if (trajectory.length === 0) {
                    listDiv.innerHTML = '<li class="text-gray-500 text-center">No ANPR events found for this vehicle.</li>';
                    return;
                }

                // Process Trajectory
                let latlngs = [];
                listDiv.innerHTML = '';

                trajectory.forEach((t, index) => {
                    const latlng = [t.latitude, t.longitude];
                    latlngs.push(latlng);
                    
                    // Create animated/colored markers for trajectory
                    const isStart = index === 0;
                    const isEnd = index === trajectory.length - 1;
                    
                    let markerColor = '#3b82f6'; // Blue for middle
                    if (isStart) markerColor = '#22c55e'; // Green for start
                    if (isEnd) markerColor = '#ef4444'; // Red for end

                    // Plot marker
                    L.circleMarker(latlng, {
                        radius: 6,
                        color: markerColor,
                        weight: 2,
                        fillColor: markerColor,
                        fillOpacity: 1
                    }).bindPopup(`
                        <div class="text-sm">
                            <b>Event #${index + 1}</b><br>
                            <b>Camera:</b> ${t.camera_name}<br>
                            <b>Time:</b> ${t.timestamp}
                        </div>
                    `).addTo(trajectoryLayer);

                    // Add to sidebar list
                    listDiv.innerHTML += `
                        <li class="flex items-start gap-3 p-3 rounded hover:bg-slate-50 border border-transparent hover:border-slate-200 transition">
                            <div class="bg-blue-100 text-blue-700 font-bold h-8 w-8 rounded-full flex items-center justify-center shrink-0 border border-blue-200">
                                ${index + 1}
                            </div>
                            <div>
                                <div class="font-bold text-slate-800">${t.camera_name}</div>
                                <div class="text-xs text-gray-500 flex items-center gap-1 mt-1">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                                    </svg>
                                    ${t.timestamp}
                                </div>
                            </div>
                        </li>
                    `;
                });

                // Draw connecting path line (with arrow effect simulating trajectory)
                const path = L.polyline(latlngs, {
                    color: '#3b82f6', 
                    weight: 3,
                    opacity: 0.7,
                    dashArray: '10, 10' // Dashed line
                }).addTo(trajectoryLayer);
                
                // Animate to fit all trajectory points beautifully
                map.flyToBounds(path.getBounds(), {
                    padding: [50, 50],
                    duration: 1.5
                });

            } catch (err) {
                console.error("Search error", err);
                errorDiv.innerText = err.message || "An error occurred fetching data.";
                errorDiv.classList.remove('hidden');
                listDiv.innerHTML = '';
            }
        }

        // Initialize on page load
        document.addEventListener("DOMContentLoaded", () => {
            fetchStats();
            fetchAlerts();
            fetchCameras();
        });
    </script>
</body>
</html>
